services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes: ['./observability/collector.yml:/etc/otelcol/config.yaml:ro']
    ports: ['127.0.0.1:4317:4317','127.0.0.1:4318:4318']
  prometheus:
    image: prom/prometheus:v3.16.0
    volumes: ['./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['127.0.0.1:9090:9090']
  tempo:
    image: grafana/tempo:2.8.2
    command: ['-config.file=/etc/tempo.yml']
    volumes: ['./observability/tempo.yml:/etc/tempo.yml:ro']
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: local-grafana-password
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3000:3000']
