name: Java 25 build and correctness
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -f implementations/spring-boot/pom.xml verify
      - name: JMH smoke only (not a publishable benchmark)
        run: >-
          java -jar implementations/spring-boot/benchmarks-jmh/target/benchmarks.jar
          '.*CacheBenchmark.readOnly' -p strategy=snapshot -p count=10000 -f 1 -wi 1 -i 1 -w 1s -r 1s -t 4
      - name: Docker Compose HTTP smoke
        env:
          SPRING_PROFILES_ACTIVE: lab
        run: |
          docker compose up -d --build
          python3 tools/smoke_api.py
          python3 tools/check_extended.py
          docker compose up -d mock-api
          python3 tools/compare_http.py --url http://localhost:8080
      - name: Compose diagnostics and cleanup
        if: always()
        run: |
          docker compose logs --no-color > compose-ci.log 2>&1 || true
          docker compose down -v || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            implementations/spring-boot/**/target/surefire-reports/
            implementations/spring-boot/**/target/failsafe-reports/
            compose-ci.log
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet test implementations/aspnet-core/Lab.Tests/Lab.Tests.csproj -f net10.0
      - run: dotnet test implementations/aspnet-core/Lab.Tests/Lab.Tests.csproj -f net11.0
      - run: dotnet build implementations/aspnet-core/Lab.Benchmarks/Lab.Benchmarks.csproj -c Release
      - run: |
          docker compose --profile dotnet up -d --build dotnet mock-api
          python3 tools/compare_http.py --url http://localhost:8082
      - if: always()
        run: docker compose --profile dotnet down -v
  jakarta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker compose --profile jakarta up -d --build jakarta mock-api
          python3 tools/compare_http.py --url http://localhost:8081
      - if: always()
        run: docker compose --profile jakarta down -v
